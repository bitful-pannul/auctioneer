[package]
name = "auctioneer"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
alloy-sol-types = "0.7.6"
alloy-primitives = "0.7.6"
alloy-rlp = "0.3.5"
alloy = { version = "0.1.2", features = [
    "network",
    "signers",
    "signer-local",
    "consensus",
    "rpc-types"
]}
bincode = "1.3.3"
kinode_process_lib = { git = "https://github.com/kinode-dao/process_lib", tag = "v0.8.0" }
frankenstein = { version = "0.30", default-features = false, features = ["telegram-trait"] }
url = "2.5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
llm_interface = { git = "https://github.com/kinode-dao/llm", branch = "interface"}
wit-bindgen = "0.24.0"
rand = "0.8.5"
hex = "0.4.3"
regex = "1.10.4"

[lib]
crate-type = ["cdylib"]

[package.metadata.component]
package = "kinode:process"
